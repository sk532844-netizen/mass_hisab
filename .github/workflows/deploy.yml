name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
        env:
          # Firebase web config — public by design (embedded in the
          # client-side app), same as the old Supabase anon key was.
          VITE_FIREBASE_API_KEY: AIzaSyBfLJLdZ_44-mW155TQdSjcHc60ds9UHhY
          VITE_FIREBASE_AUTH_DOMAIN: mass--2.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mass--2
          VITE_FIREBASE_STORAGE_BUCKET: mass--2.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 854323042772
          VITE_FIREBASE_APP_ID: 1:854323042772:web:a019ef3d892c55baf45e41
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
