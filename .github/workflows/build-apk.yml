name: Build Android APK


on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'capacitor.config.json'
      - 'android/**'
      - 'package.json'


jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBfLJLdZ_44-mW155TQdSjcHc60ds9UHhY
          VITE_FIREBASE_AUTH_DOMAIN: mass--2.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mass--2
          VITE_FIREBASE_STORAGE_BUCKET: mass--2.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 854323042772
          VITE_FIREBASE_APP_ID: 1:854323042772:web:a019ef3d892c55baf45e41
      - name: Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mess-hisab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
